<style>
:root {
  --bg:#f5f1eb; --panel:#fffdfa; --text:#201c18; --muted:#7a7269;
  --line:#ded5c9; --brand:#0b675f; --brand-dark:#084e49; --soft:#eee6db;
  --shadow:0 12px 34px rgba(45,35,25,.08); --radius:26px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{margin:0;background:linear-gradient(180deg,#f7f4ef 0,#efe7dc 100%);color:var(--text);
font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR","Apple SD Gothic Neo",sans-serif}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.app{max-width:860px;margin:0 auto;padding:12px 12px 28px}
.top{background:rgba(255,253,250,.97);border:1px solid rgba(60,45,30,.06);border-radius:24px;padding:13px;
box-shadow:var(--shadow);position:sticky;top:8px;z-index:20;backdrop-filter:blur(10px)}
.brandrow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.brand{display:flex;align-items:center;gap:9px;font-size:21px;font-weight:900;letter-spacing:-.03em}
.brand img{width:31px;height:31px;border-radius:9px}
.progress{font-weight:800;color:var(--muted);font-size:14px}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.tab{border:0;background:var(--soft);border-radius:18px;padding:11px 8px;font-weight:900;font-size:15px}
.tab.active{background:var(--brand);color:#fff}
.studybar{display:grid;grid-template-columns:150px 1fr auto auto;gap:8px;margin-top:10px;align-items:center}
.control{height:44px;border:1px solid var(--line);background:#fff;border-radius:14px;padding:0 12px;min-width:0}
.btn{height:44px;border:0;border-radius:14px;padding:0 14px;background:var(--soft);font-weight:900;white-space:nowrap}
.btn.primary{background:var(--brand);color:#fff}
.btn.ghost{background:#fff;border:1px solid var(--line)}
.scopebar{display:none;margin-top:8px;align-items:center;gap:8px;flex-wrap:wrap}
.scopebar.show{display:flex}
.scope-pill{display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border-radius:999px;background:#e0f0ed;color:var(--brand-dark);font-weight:900;font-size:13px}
.scope-pill button{border:0;background:transparent;color:inherit;font-weight:900;font-size:16px;line-height:1}
.quickrow{display:flex;gap:7px;margin-top:8px;overflow-x:auto;padding-bottom:1px}
.quickrow .btn{flex:0 0 auto;height:40px;padding:0 13px;font-size:13px}
.page{display:none}
.page.active{display:block}
.card-wrap{margin-top:14px;perspective:1400px}
.card{position:relative;height:min(72vh,650px);min-height:510px;transform-style:preserve-3d;transition:transform .52s cubic-bezier(.2,.7,.2,1)}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:30px;border:1px solid rgba(70,50,30,.07);box-shadow:var(--shadow);
overflow:hidden;display:grid;grid-template-rows:auto 1fr auto;background:var(--panel)}
.front{background:linear-gradient(180deg,#fffefb 0,#f9f4ec 100%)}
.back{transform:rotateY(180deg);background:linear-gradient(180deg,#0d6c63,#084f49);color:#fff}
.face-head{display:flex;justify-content:space-between;align-items:center;padding:16px 18px 0}
.badge{font-size:13px;font-weight:900;padding:8px 12px;border-radius:999px;background:rgba(0,0,0,.055)}
.back .badge{background:rgba(255,255,255,.15)}
.back .progress{color:rgba(255,255,255,.72);font-weight:850}
.face-main{display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:10px 22px;overflow:auto}
.greek{font-family:"Times New Roman","Palatino Linotype","Noto Serif",serif;font-size:clamp(80px,17vw,150px);line-height:1.04;
letter-spacing:.003em;word-break:break-word;max-width:100%}

/* v5.3 final: Greek headword stays dominant; grammatical companion forms stay secondary. */

.greek-main,.ov-greek-main{display:block;max-width:100%;min-width:0}
.greek-subline,.ov-greek-subline{max-width:100%}

.greek-main{font:inherit;line-height:1.02;white-space:nowrap}
.greek-subline{
  margin-top:14px;display:flex;align-items:center;justify-content:center;gap:9px;flex-wrap:wrap;
  font-family:"Times New Roman","Palatino Linotype","Noto Serif",serif;
  font-size:clamp(18px,2.8vw,26px);line-height:1.2;color:#6f675f
}
.greek-subvalue{font-weight:650}
.greek-subdot{color:#b7aea4;font-size:.75em}

.ov-greek-main{font:inherit;line-height:1.02;white-space:nowrap}
.ov-greek-subline{
  margin-top:6px;display:flex;align-items:center;justify-content:center;gap:5px;flex-wrap:wrap;
  font-family:"Times New Roman","Palatino Linotype",serif;font-size:12px;line-height:1.15;color:#7a7269
}
.ov-greek-dot{color:#b9b0a6}

.meaning{font-size:clamp(38px,8vw,64px);font-weight:950;line-height:1.12;word-break:keep-all}
.pron{margin-top:17px;font-size:clamp(27px,5.8vw,40px);font-weight:900;line-height:1.25}
.pos{margin-top:9px;font-size:14px;font-weight:750;color:rgba(255,255,255,.8)}
.detailbtn{position:relative;z-index:35;pointer-events:auto;margin-top:17px;border:1px solid rgba(255,255,255,.38);background:rgba(255,255,255,.12);color:#fff;
border-radius:999px;padding:10px 18px;font-weight:900}
.navbar{padding:12px 14px 14px;display:grid;grid-template-columns:1fr 1.2fr 1fr;gap:8px}

const el=id=>document.getElementById(id);
const lessonNum=x=>parseInt(String(x.lesson||x).replace(/\D/g,''),10);
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));

let list=[...ALL], idx=0, currentTab='cards', overviewPron=true;
let scopeMode='all', scopeLessons=new Set(), rangeA=3, rangeB=33;
let prayerIdx=0, showPrayerPron=true, showPrayerMeaning=true, showPrayerGloss=true, prayerHidden=false;
let gradeMode='letters';

function uniqueLessons(){return [...new Set(ALL.map(lessonNum))].sort((a,b)=>a-b)}

function setupSelectors(){
  const L=uniqueLessons();
  el('lessonSelect').innerHTML='<option value="all">전체 과</option>'+L.map(n=>`<option value="${n}">${n}과</option>`).join('');
  el('rangeStart').innerHTML=L.map(n=>`<option value="${n}">${n}과</option>`).join('');
  el('rangeEnd').innerHTML=L.map(n=>`<option value="${n}">${n}과</option>`).join('');
  el('rangeStart').value=L[0]; el('rangeEnd').value=L[L.length-1];
  el('lessonGrid').innerHTML=L.map(n=>`<button class="lesson-chip" data-lesson="${n}">${n}과</button>`).join('');
  document.querySelectorAll('.lesson-chip').forEach(b=>b.addEventListener('click',()=>{
    const n=+b.dataset.lesson;
    b.classList.toggle('on');
    if(b.classList.contains('on')) scopeLessons.add(n); else scopeLessons.delete(n);
  }));
}

function setAllScope(){
  scopeMode='all'; scopeLessons.clear(); el('lessonSelect').value='all';
  document.querySelectorAll('.lesson-chip').forEach(b=>b.classList.remove('on'));
  updateScopeUI(); applyFilter();
}

function setSingleLesson(n){
  if(n==='all') return setAllScope();
  scopeMode='single'; scopeLessons=new Set([+n]);
  document.querySelectorAll('.lesson-chip').forEach(b=>b.classList.toggle('on',+b.dataset.lesson===+n));
  updateScopeUI(); applyFilter();
}

function applyRange(){
  let a=+el('rangeStart').value,b=+el('rangeEnd').value; if(a>b)[a,b]=[b,a];
  rangeA=a; rangeB=b; scopeMode='range'; scopeLessons=new Set();
  uniqueLessons().forEach(n=>{if(n>=a&&n<=b)scopeLessons.add(n)});
  document.querySelectorAll('.lesson-chip').forEach(b=>b.classList.toggle('on',scopeLessons.has(+b.dataset.lesson)));
  el('lessonSelect').value='all';
  updateScopeUI(); applyFilter(); closeModal('rangeModal');
}

function applyCustomChips(){
  if(!scopeLessons.size){setAllScope();closeModal('rangeModal');return}
  const arr=[...scopeLessons].sort((a,b)=>a-b);
  if(arr.length===1){scopeMode='single';el('lessonSelect').value=String(arr[0])}
  else scopeMode='custom';
  updateScopeUI();applyFilter();closeModal('rangeModal');
}

function updateScopeUI(){
  let txt='';
  if(scopeMode==='all'){el('scopebar').classList.remove('show');return}
  if(scopeMode==='single')txt=`${[...scopeLessons][0]}과`;
  if(scopeMode==='range')txt=`${rangeA}과 ~ ${rangeB}과`;
  if(scopeMode==='custom')txt=[...scopeLessons].sort((a,b)=>a-b).map(n=>`${n}과`).join(', ');
  el('scopeText').textContent='학습 범위 · '+txt;
  el('scopebar').classList.add('show');
}

function applyFilter(){
  const q=el('search').value.trim().toLowerCase();
  list=ALL.filter(c=>{
    const lessonOK=scopeMode==='all'||scopeLessons.has(lessonNum(c));
    const hay=`${c.greek} ${c.meaning} ${c.pron} ${c.pos} ${c.note}`.toLowerCase();
    return lessonOK && (!q || hay.includes(q));
  });
  idx=0;renderCard();renderOverview();
}


function greekDisplayParts(c){
  const parts=String(c.greek||'').split(',').map(x=>x.trim()).filter(Boolean);
  const main=parts[0]||'';
  const sub=[];
  const articles=new Set(['ὁ','ἡ','τό']);

  if(String(c.pos||'').startsWith('noun')){
    // Front/overview: only keep a real noun genitive/related form.
    // Gender articles (ὁ/ἡ/τό) and adjective-style shorthand endings are not shown here.
    const extras=parts.slice(1).filter(v=>!articles.has(v));
    extras.forEach(v=>{
      // Do not show one/two-letter shorthand endings such as ή / όν.
      const baseCount=Array.from(v.normalize('NFD')).filter(ch=>!/\p{M}/u.test(ch)).length;
      if(baseCount>=3) sub.push(v);
    });
  }

  const n=Array.from(main.normalize('NFD')).filter(ch=>!/\p{M}/u.test(ch)).length;
  const sizeClass=n>=12?'greek-fit-long':(n>=9?'greek-fit-mid':'greek-fit-normal');
  return {main,sub,sizeClass};
}
function greekFrontMarkup(c){
  const g=greekDisplayParts(c);
  const sub=g.sub.length
    ? `<div class="greek-subline">${g.sub.map(v=>`<span class="greek-subvalue">${esc(v)}</span>`).join('<span class="greek-subdot">·</span>')}</div>`
    : '';
  return `<div class="greek-main ${g.sizeClass}">${esc(g.main)}</div>${sub}`;
}
function greekOverviewMarkup(c){
  const g=greekDisplayParts(c);
  const sub=g.sub.length
    ? `<div class="ov-greek-subline">${g.sub.map(v=>`<span class="ov-greek-subvalue">${esc(v)}</span>`).join('<span class="ov-greek-dot">·</span>')}</div>`
    : '';
  return `<div class="ov-greek-main ${g.sizeClass}">${esc(g.main)}</div>${sub}`;
}

/* Mobile-only safety fit.
   Desktop/tablet keep their CSS size. On phones, only a headword that actually
   exceeds the available width is reduced until it fits. */
function fitGreekLine(el,minPx){
  if(!el) return;
  el.style.fontSize='';

  // Measure against the actual card content box, not the text wrapper.
  // This makes the same rule reliable on phones, tablets and desktop.
  const container=el.classList.contains('ov-greek-main')
    ? el.closest('.ov-face')
    : el.closest('.face-main');
  if(!container) return;

  const cs=getComputedStyle(container);
  const available=Math.max(
    1,
    container.clientWidth
      - parseFloat(cs.paddingLeft||0)
      - parseFloat(cs.paddingRight||0)
      - 4
  );

  const range=document.createRange();
  range.selectNodeContents(el);
  let textWidth=range.getBoundingClientRect().width;
  let size=parseFloat(getComputedStyle(el).fontSize)||50;

  // Short/normal words keep their designed size.
  if(textWidth<=available) return;

  // Only an actually overflowing headword is reduced.
  size=Math.max(minPx,Math.floor(size*(available/textWidth)*0.985));
  el.style.fontSize=size+'px';

  let guard=30;
  while(guard-- > 0 && size>minPx){
    range.selectNodeContents(el);
    textWidth=range.getBoundingClientRect().width;
    if(textWidth<=available) break;
    size-=1;
    el.style.fontSize=size+'px';
  }
}
function fitGreekDisplays(){
  requestAnimationFrame(()=>{
    fitGreekLine(document.querySelector('#greek .greek-main'),30);
    document.querySelectorAll('.ov-greek-main').forEach(node=>fitGreekLine(node,17));
  });
}

function humanPos(p){

  .replace('preposition','전치사').replace('participle','분사').replace('conjunction','접속사')

function handleStudyCardClick(e){

  const x=e.clientX-rect.left;
  const ratio=x/rect.width;

  // 기존 학습 감각 유지:
  // 왼쪽 약 24% = 이전 / 가운데 = 뒤집기 / 오른쪽 약 24% = 다음

function updatedNoteForm(value){
  const parts=String(value).split('|');
  return `<span class="noun-form">${esc(parts[0])}${parts.length>1?`<span class="noun-ending">${esc(parts.slice(1).join(''))}</span>`:''}</span>`;
}
function showUpdatedDetailFor(c){

  el('detailWord').textContent=c.greek;
  const row=(title,value)=>`<div class="detail-row"><div class="detail-label">${esc(title)}</div><div class="detail-value">${value}</div></div>`;
  let h=row(`${c.lesson} · ${humanPos(c.pos)}`,`${esc(c.meaning)}<br><span class="muted">${esc(c.pron)}</span>`);
  h+=row('기본형 · 학습 범위',`${esc(note.lemma)}<br>${esc(note.type)}`);
  h+=note.tables.map(t=>{
    const heads=t.kind==='case'?['격','단수','발음','복수','발음']:t.kind==='verb'?['인칭','실제 형태','발음','뜻']:t.headers||['항목','설명'];
    const rows=t.rows.map(r=>`<tr>${r.map((v,i)=>`<td>${((t.kind==='verb'&&i===1)||(t.kind==='case'&&(i===1||i===3)))?updatedNoteForm(v):esc(v)}</td>`).join('')}</tr>`).join('');
    return `<div class="detail-row detail-update-section"><div class="detail-label">${esc(t.title)}</div><div class="detail-update-scroll"><table class="detail-update-table"><thead><tr>${heads.map(v=>`<th>${esc(v)}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table></div></div>`;

}

function verbFiniteFormLabel(c){
  const n=String(c.note||'').toLowerCase();
  if(n.includes('aorist passive')) return '부정과거 수동형';
  if(n.includes('2nd aorist of')) return '제2부정과거형';
  if(n.includes('aorist of')) return '부정과거형';
  if(n.includes('perfect of')) return '완료형';
  if(n.includes('future of') || n.includes('deponent future of')) return '미래형';
  return '';
}
function isPresentLemmaVerb(c){
  if(c.pos!=='verb') return false;
  if(verbFiniteFormLabel(c)) return false;
  const h=String(c.greek||'').split(',')[0].trim();
  return h.endsWith('ω') && !(h.endsWith('άω')||h.endsWith('έω')||h.endsWith('όω'));
}

function regularOmegaPresentForms(word){
  const h=String(word||'').split(',')[0].trim();
  if(!h.endsWith('ω')) return null;
  // Contract verbs are handled separately; do not manufacture contracted forms here.
  if(h.endsWith('άω') || h.endsWith('έω') || h.endsWith('όω')) return null;
  const stem=h.slice(0,-1);
  return [
    ['1인칭 단수', h],
    ['2인칭 단수', stem+'εις'],
    ['3인칭 단수', stem+'ει'],
    ['1인칭 복수', stem+'ομεν'],
    ['2인칭 복수', stem+'ετε'],
    ['3인칭 복수', stem+'ουσι(ν)']
  ];
}


function deponentPresentForms(word){
  const h=String(word||'').split(',')[0].trim();
  const f=DEPONENT_FORMS[h];
  if(!f) return null;
  const labels=['1인칭 단수','2인칭 단수','3인칭 단수','1인칭 복수','2인칭 복수','3인칭 복수'];
  return labels.map((x,i)=>[x,f[i]]);
}




function hangulParts(ch){
  const code=ch.charCodeAt(0);
  if(code<0xAC00 || code>0xD7A3) return null;
  const n=code-0xAC00;
  return {
    choseong:Math.floor(n/588),
    jungseong:Math.floor((n%588)/28),
    jongseong:n%28
  };
}
function makeHangul(choseong,jungseong,jongseong=0){
  return String.fromCharCode(0xAC00 + choseong*588 + jungseong*28 + jongseong);
}
function splitHangulSyllables(s){return Array.from(String(s||''));}

/* Base pronunciation example:
   λαμβάνω = 람바노.
   The final "노" contains the stem consonant ν + the -ω vowel.
   We reuse that onset when attaching -εις, -ει, -ομεν, -ετε, -ουσι(ν).
   This avoids exposed jamo such as "라ㅁ". */
function activeOmegaPron(basePron, form){
  const chars=splitHangulSyllables(basePron);
  if(!chars.length)return '';
  const last=chars[chars.length-1];
  const p=hangulParts(last);
  if(!p)return basePron;

  const prefix=chars.slice(0,-1).join('');
  const head=String(form||'');

  if(head.endsWith('ω')) return basePron;

  // Korean medial indices: ㅔ=5, ㅗ=8, ㅜ=13
  const E=5, O=8, U=13;
  const eSyll=makeHangul(p.choseong,E,0);
  const oSyll=makeHangul(p.choseong,O,0);
  const uSyll=makeHangul(p.choseong,U,0);

  if(head.endsWith('εις')) return prefix+eSyll+'이스';
  if(head.endsWith('ει')) return prefix+eSyll+'이';
  if(head.endsWith('ομεν')) return prefix+oSyll+'멘';
  if(head.endsWith('ετε')) return prefix+eSyll+'테';
  if(head.endsWith('ουσι(ν)')) return prefix+uSyll+'시(ㄴ)';
  return basePron;
}

/* Deponent/middle-form lemma example:
   δέχομαι = 데코마이.
   We find the syllable immediately before "마이", reuse its onset,
   and attach the middle/passive endings without ever outputting loose jamo. */
function deponentPron(basePron, form){
  const chars=splitHangulSyllables(basePron);
  if(chars.length<3)return basePron;

  // Most course spellings end in ...오마이. The syllable before 마이 is the
  // consonant+ο syllable (e.g. 코 in 데코마이).
  let pivot=chars.length-3;
  if(pivot<0)return basePron;
  const p=hangulParts(chars[pivot]);
  if(!p)return basePron;
  const prefix=chars.slice(0,pivot).join('');

  const E=5, O=8;
  const eSyll=makeHangul(p.choseong,E,0);
  const oSyll=makeHangul(p.choseong,O,0);
  const onSyll=makeHangul(p.choseong,O,4); // final ㄴ
  const head=String(form||'');

  if(head.endsWith('ομαι')) return basePron;
  if(head.endsWith('ῃ') || head.endsWith('η')) return prefix+eSyll;
  if(head.endsWith('εται')) return prefix+eSyll+'타이';
  if(head.endsWith('όμεθα') || head.endsWith('ομεθα')) return prefix+oSyll+'메타';
  if(head.endsWith('εσθε')) return prefix+eSyll+'스테';
  if(head.endsWith('ονται')) return prefix+onSyll+'타이';
  return basePron;
}

function endingInfo(form){
  const f=String(form||'');
  const endings=['ουσι(ν)','ομεν','ετε','εις','ει','ω'];
  for(const e of endings){
    if(f.endsWith(e)) return {stem:f.slice(0,-e.length),ending:e};
  }
  return {stem:f,ending:''};
}

function formWithEnding(form,pron=''){
  const p=endingInfo(form);
  return `<div style="line-height:1.15">
    <span style="font-family:'Times New Roman','Palatino Linotype',serif;font-size:29px;font-weight:700;white-space:nowrap">

  </div>`;
}


function nounEndingCell(v){

}


function nounActualForms(greek,pos){
  const head=String(greek||'').split(',')[0].trim();
  return NOUN_PARADIGMS[head] || null;
}

function nounCaseKorean(caseName){
  const map={
    '주격':'이/가, 은/는',
    '속격':'~의',
    '여격':'~에게, ~에, ~로',
    '목적격':'을/를',
    '호격':'~아/야, ~여'
  };
  return map[String(caseName||'')]||'';
}

function nounWordForm(stem, ending){
  return `<span class="noun-form">${esc(stem)}<span class="noun-ending">${esc(ending)}</span></span>`;
}


function verbEndingPron(ending){
  const map={
    '-ω':'오',
    '-εις':'에이스',
    '-ει':'에이',
    '-ομεν':'오멘',
    '-ετε':'에테',
    '-ουσι(ν)':'우시(ㄴ)'
  };
  return map[String(ending||'')]||'';
}

function existingDetailHTML(c){
  const d=DETAILS[detailKey(c)];
  if(!d||d.kind==='none'||!d.sections.length)return '';

  let h=`<div class="detail-row"><div class="detail-label">${esc(c.lesson)} · ${esc(humanPos(c.pos))}</div><div class="detail-value" style="font-size:20px">${esc(c.meaning)}<br><span class="muted">${esc(c.pron)}</span></div></div>`;

  let sections=[...d.sections].map(s=>{
    if(s.type==='verbforms'){
      return {...s,rows:s.rows.map(r=>[r[0],r[1],r[2],activeOmegaPron(c.pron,r[1])])};
    }
    return s;
  });

  // Verified verb display:
  // - present lemmas may receive a present 6-person paradigm
  // - future/aorist/passive/perfect vocabulary forms never get mislabeled as present
  if(c.pos==='verb'){
    const head=String(c.greek||'').split(',')[0].trim();
    const special=SPECIAL_VERB_FORMS[head];
    const formLabel=verbFiniteFormLabel(c);
    const dep=deponentPresentForms(c.greek);
    const hasExactWordForms=sections.some(s=>s.type==='verbforms');

    if(formLabel){
      sections=sections.map(s=>s.type==='summary'&&s.label==='형태 분류'?{...s,value:formLabel}:s);
    }else if(special && !hasExactWordForms){
      sections.unshift({type:'verbactual',label:'현재 직설법 6인칭 · 이 단어',rows:special});
    }else if(isPresentLemmaVerb(c) && !hasExactWordForms){
      const actual=regularOmegaPresentForms(c.greek);
      if(actual){
        sections=sections.filter(s=>!(s.type==='endings' && String(s.label||'').includes('기본 어미')));
        sections.unshift({
          type:'verbactual',
          label:'현재 능동태 직설법 6인칭 · 이 단어',
          rows:actual.map(r=>[r[0],r[1],activeOmegaPron(c.pron,r[1])])
        });
      }
    }else if(dep && !hasExactWordForms){
      sections.unshift({
        type:'verbactual',
        label:'현재 중간형 6인칭 · 이 단어',
        rows:dep.map(r=>[r[0],r[1],deponentPron(c.pron,r[1])])
      });
      sections.unshift({type:'note',label:'형태 특징',value:'형태는 중간/수동태 어미를 사용하지만, 이 동사는 문맥에서 능동적 의미로 쓰이는 디포넌트 동사입니다.'});
    }
  }

  if(c.pos && c.pos.startsWith('noun')){
    const nounForms=nounActualForms(c.greek,c.pos);
    if(nounForms){
      sections=sections.filter(s=>s.type!=='declension');
      sections.push({
        type:'nounactual',
        label:'실제 격변화 · 이 단어',
        rows:nounForms
      });
    }
  }

  const hw=String(c.greek||'').split(',')[0].trim();
  if(CLASS_VOCAB[hw]){
    sections.unshift({type:'note',label:'수업자료 의미',value:CLASS_VOCAB[hw]});
  }

  h+=sections.map(renderDetailSection).join('');
  h+=`<div class="detail-row"><div class="detail-label">정보 기준</div><div class="detail-value" style="font-size:13px">교재/Machen 어휘 데이터는 원자료를 유지하고, 변화표·유형 설명은 표준 코이네 헬라어 문법 규칙을 별도 확장 정보로 구성했습니다.</div></div>`;
  return h;
}

let currentOrder=null;

function prayerTokens(text){
  return String(text||'').trim().split(/\s+/).filter(Boolean);
}
function shuffleArray(a){
  const x=[...a];
  for(let i=x.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [x[i],x[j]]=[x[j],x[i]];
  }
  return x;
}
function examUnitForNote(noteNumber){
  return PRAYER_EXAM_UNITS.find(u=>u.noteIds.includes(Number(noteNumber))) || PRAYER_EXAM_UNITS[0];
}
function makeOrderPractice(unit){
  const tokens=prayerTokens(unit.greek).map((raw,i)=>({id:i,raw}));
  let bank=shuffleArray(tokens);
  if(bank.length>1 && bank.every((x,i)=>x.id===tokens[i].id)){
    bank=[...bank.slice(1),bank[0]];
  }
  currentOrder={unit,original:tokens,bank,answer:[]};
}
function orderChipHTML(x,where){
  return `<button class="order-chip" type="button" data-id="${x.id}" data-where="${where}">${esc(x.raw)}</button>`;
}
function renderOrderAreas(){
  if(!currentOrder)return;
  const ans=el('orderAnswer'), bank=el('orderBank');
  if(ans)ans.innerHTML=currentOrder.answer.map(x=>orderChipHTML(x,'answer')).join('');
  if(bank)bank.innerHTML=currentOrder.bank.map(x=>orderChipHTML(x,'bank')).join('');
  document.querySelectorAll('.order-chip').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const id=Number(btn.dataset.id);
      if(btn.dataset.where==='bank'){
        const ix=currentOrder.bank.findIndex(x=>x.id===id);
        if(ix>=0)currentOrder.answer.push(currentOrder.bank.splice(ix,1)[0]);
      }else{
        const ix=currentOrder.answer.findIndex(x=>x.id===id);
        if(ix>=0)currentOrder.bank.push(currentOrder.answer.splice(ix,1)[0]);
      }
      renderOrderAreas();
    });
  });
}
function aggregatedStudyHTML(unit){
  const rows=[];
  unit.noteIds.forEach(id=>{
    const n=PRAYER_NOTES[id];
    const study=PRAYER_STUDY[id];
    (n?.items||[]).forEach(r=>rows.push(r));
    (study?.grammar||[]).forEach(r=>{
      if(!rows.some(x=>x[0]===r[0] && x[1]===r[1])) rows.push(r);
    });
  });
  const items=rows.map(r=>`<div class="prayer-note-item"><div class="pg">${esc(r[0])}</div><div class="pk">${esc(r[1])}</div></div>`).join('');
  return `<div class="practice-study">
    <div class="note-section-title">정답 문장</div>
    <div class="practice-answer">${esc(unit.greek)}</div>
    <div class="practice-pron">${esc(unit.pron)}</div>
    <div class="practice-meaning">${esc(unit.meaning)}</div>
    <div class="practice-gloss">직역 · ${esc(unit.gloss)}</div>
    <div class="note-section-title" style="margin-top:16px">단어 · 문법 포인트</div>
    <div class="prayer-note-list">${items}</div>
  </div>`;
}
function renderPrayerPractice(unit){
  makeOrderPractice(unit);
  return `<div class="quiz-card prayer-order-only">
    <div class="note-section-title">시험 대비 · 문장 순서 맞추기</div>
    <div class="practice-prompt">${esc(unit.meaning)}</div>
    <div class="order-hint">아래에는 이 문장의 헬라어 단어가 모두 들어 있습니다. 순서대로 터치해 위 문장을 완성하세요.</div>
    <div class="order-answer" id="orderAnswer"></div>
    <div class="order-bank" id="orderBank"></div>
    <div class="quiz-controls">
      <button class="mini primary" type="button" id="practiceCheckBtn">제출</button>
      <button class="mini" type="button" id="practiceNewBtn">다시 섞기</button>
      <button class="mini" type="button" id="orderResetBtn">처음으로</button>
    </div>
    <div class="practice-result" id="practiceResult"></div>
    <details id="practiceDetails"><summary class="mini">자세히 · 정답과 해설 보기</summary>${aggregatedStudyHTML(unit)}</details>
  </div>`;
}
function bindPrayerPractice(unit){
  renderOrderAreas();

  const reset=el('orderResetBtn');
  if(reset)reset.addEventListener('click',()=>{
    currentOrder.bank=shuffleArray([...currentOrder.original]);
    currentOrder.answer=[];
    renderOrderAreas();
    const r=el('practiceResult'); if(r){r.classList.remove('show');r.innerHTML='';}
  });

  const fresh=el('practiceNewBtn');
  if(fresh)fresh.addEventListener('click',()=>showPrayerPractice(unit.noteIds[0]));

  const check=el('practiceCheckBtn');
  if(check)check.addEventListener('click',()=>{
    const result=el('practiceResult');
    const complete=currentOrder.answer.length===currentOrder.original.length;
    const correct=complete && currentOrder.answer.every((x,i)=>x.id===currentOrder.original[i].id);
    const status=!complete?'아직 모든 단어를 사용하지 않았습니다.':(correct?'정답입니다.':'순서를 다시 확인해 보세요.');
    result.innerHTML=`<div class="${correct?'quiz-ok':'quiz-bad'}"><strong>${status}</strong></div>`;
    result.classList.add('show');
    result.scrollIntoView({behavior:'smooth',block:'nearest'});
  });
}

function showPrayerPractice(noteNumber=null){
  const p=noteNumber ? prayerList().find(x=>x.n===Number(noteNumber)) : prayerList()[prayerIdx];
  if(!p)return;
  const unit=examUnitForNote(p.n);
  el('prayerNoteTitle').textContent=`연습문제 · 문장 ${unit.id}`;
  el('prayerNoteBody').innerHTML=renderPrayerPractice(unit);
  openModal('prayerNoteModal');
  bindPrayerPractice(unit);
}
/* Per-line explanation, using existing PRAYER_NOTES / PRAYER_STUDY without deleting data. */
function showPrayerNote(noteNumber=null){
  const p=noteNumber ? prayerList().find(x=>x.n===Number(noteNumber)) : prayerList()[prayerIdx];
  if(!p)return;
  const note=PRAYER_NOTES[p.n]||{};
  const study=PRAYER_STUDY[p.n]||{};
  const rows=[];
  (note.items||[]).forEach(r=>rows.push(r));
  (study.grammar||[]).forEach(r=>{
    if(!rows.some(x=>x[0]===r[0]&&x[1]===r[1]))rows.push(r);
  });
  const items=rows.map(r=>`<div class="prayer-note-item"><div class="pg">${esc(r[0])}</div><div class="pk">${esc(r[1])}</div></div>`).join('');
  el('prayerNoteTitle').textContent=`${p.n}행 · 자세히${p.doxology?' (송영)':''}`;
  el('prayerNoteBody').innerHTML=`
    <div class="detail-row"><div class="detail-label">헬라어 원문</div><div class="detail-value" style="font-family:'Times New Roman',serif;font-size:25px">${esc(p.greek)}</div></div>
    <div class="detail-row"><div class="detail-label">한글 발음</div><div class="detail-value">${esc(p.pron)}</div></div>
    <div class="detail-row"><div class="detail-label">의미</div><div class="detail-value">${esc(p.meaning)}</div></div>
    <div class="detail-row"><div class="detail-label">직역·구조</div><div class="detail-value">${esc(p.gloss)}</div></div>
    <div class="detail-row"><div class="detail-label">단어별 뜻과 문법</div><div class="prayer-note-list">${items}</div></div>
    ${study.classNote ? `<div class="detail-row"><div class="detail-label">기존 문장 공부 노트</div><div class="detail-value">${esc(study.classNote)}</div></div>` : ''}`;
  openModal('prayerNoteModal');
}
function prayerList(){return [...PRAYER,DOXOLOGY]}
function renderPrayer(){
  const arr=prayerList(); if(prayerIdx>=arr.length)prayerIdx=arr.length-1;if(prayerIdx<0)prayerIdx=0;
  const p=arr[prayerIdx];el('prayerNum').textContent=`${prayerIdx+1} / ${arr.length}`;
  el('prayerGreek').textContent=prayerHidden?'••••••••••••':p.greek;
  el('prayerPron').textContent=showPrayerPron?p.pron:'';
  el('prayerMeaning').textContent=showPrayerMeaning?p.meaning:'';
  el('prayerGloss').textContent=showPrayerGloss?('직역 · '+p.gloss):'';
  el('progressTop').textContent=`${prayerIdx+1} / ${arr.length}`;renderFullPrayer();
}
function renderFullPrayer(){
  const arr=prayerList();
  el('fullPrayer').innerHTML=arr.map(p=>`<div class="full-line">
    <button class="full-note-btn" type="button" data-pnote="${p.n}" aria-label="${p.n}행 자세히" title="해당 문장 문법 해설">자세히</button>
    <div class="g">${esc(p.greek)}</div>
    ${showPrayerPron?`<div class="p">${esc(p.pron)}</div>`:''}
    ${showPrayerMeaning?`<div class="m">${esc(p.meaning)}</div>`:''}
    ${showPrayerGloss?`<div class="m">직역 · ${esc(p.gloss)}</div>`:''}
  </div>`).join('');
  document.querySelectorAll('.full-note-btn').forEach(btn=>{
    btn.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();showPrayerNote(Number(btn.dataset.pnote))});
  });
}
function pPrev(){prayerIdx=(prayerIdx-1+prayerList().length)%prayerList().length;prayerHidden=false;renderPrayer()}
function pNext(){prayerIdx=(prayerIdx+1)%prayerList().length;prayerHidden=false;renderPrayer()}

function normalizeLetters(s){
  return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[·.,;··’'“”"!?\s]/g,'').toLowerCase();
}
function normalizeStrict(s){
  return String(s||'').normalize('NFC').replace(/[.,;··’'“”"!?\s]/g,'').toLowerCase();
}
function gradePrayer(){
  const input=el('writeInput').value;
  const answer=prayerList()[prayerIdx].greek;
  const a=gradeMode==='strict'?normalizeStrict(answer):normalizeLetters(answer);
  const b=gradeMode==='strict'?normalizeStrict(input):normalizeLetters(input);
  if(!b){el('scoreBox').textContent='먼저 헬라어를 입력하세요.';return}
  let same=0; const L=Math.max(a.length,b.length);
  for(let i=0;i<L;i++) if(a[i]===b[i]) same++;
  const pct=Math.round((same/L)*100);
  el('scoreBox').innerHTML=`일치율 <strong>${pct}%</strong> · ${gradeMode==='strict'?'악센트·호흡기호 포함':'글자 중심'} 비교<br><span class="muted">정답: ${esc(answer)}</span>`;
}
